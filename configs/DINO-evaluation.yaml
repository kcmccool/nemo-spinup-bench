# DINO-evaluation.yaml
# Configured for the Zenodo `50.zip` dataset unpacked at data/50/

mesh_mask: mesh_mask.nc

restart_files: 'restart'

output_variables:
  temperature:
    file: DINO_1y_grid_T.nc
    var: toce
  salinity:
    file: DINO_1y_grid_T.nc
    var: soce
  density:
    file: DINO_1y_grid_T.nc
    var: rhop
  ssh:
    file: DINO_1m_To_1y_grid_T.nc
    var: ssh
  velocity_u:
    file: DINO_1y_grid_U.nc
    var: uoce
  velocity_v:
    file: DINO_1y_grid_V.nc
    var: voce

variable_map:
  time_counter: [time]
  temperature: [toce, tn]
  velocity_u: [un, u, uoce, zonal_velocity]
  velocity_v: [vn, v, voce, meridional_velocity]
  depth: [nav_lev, deptht, depthu, depthv]
  ssh: [sshn]
  salinity: [so, sn, soce]
  density: [rhop]
